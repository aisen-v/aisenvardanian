[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "0.1.0"
description = "Personal connector to your Garmin Connect data: CLI, JSON API and MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
